# Isolated synthetic fixtures: no ports, external networks, AWS or real credentials.
name: cs2032-ingesta-test
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fixture
      POSTGRES_USER: fixture
      POSTGRES_PASSWORD: fixture-only
    volumes:
      - ./fixtures/postgres.sql:/docker-entrypoint-initdb.d/01.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U fixture -d fixture"]
      interval: 2s
      timeout: 3s
      retries: 40
  mongo:
    image: mongo:7
    volumes:
      - ./fixtures/mongo.js:/docker-entrypoint-initdb.d/01.js:ro
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 40
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: fixture
      MYSQL_USER: fixture
      MYSQL_PASSWORD: fixture-only
      MYSQL_ROOT_PASSWORD: fixture-root-only
    volumes:
      - ./fixtures/mysql.sql:/docker-entrypoint-initdb.d/01.sql:ro
    healthcheck:
      test: [CMD-SHELL, "MYSQL_PWD=fixture-only mysql --protocol=TCP -h 127.0.0.1 -u fixture fixture -e 'SELECT COUNT(*) FROM viaje'"]
      interval: 2s
      timeout: 5s
      retries: 60
  ms1:
    image: cs2032-ingesta-ms1:local
    build:
      context: ..
      dockerfile: ingesta-ms1/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: fixture
      DB_USER: fixture
      DB_PASSWORD: fixture-only
    volumes:
      - ../reports:/reports
    command: [--local-only, --output-dir, /reports/fixtures]
  ms2:
    image: cs2032-ingesta-ms2:local
    build:
      context: ..
      dockerfile: ingesta-ms2/Dockerfile
    environment:
      MONGO_URI: mongodb://mongo:27017
      DB_NAME: fixture
    volumes:
      - ../reports:/reports
    command: [--local-only, --output-dir, /reports/fixtures]
  ms3:
    image: cs2032-ingesta-ms3:local
    build:
      context: ..
      dockerfile: ingesta-ms3/Dockerfile
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: fixture
      DB_USER: fixture
      DB_PASSWORD: fixture-only
    volumes:
      - ../reports:/reports
    command: [--local-only, --output-dir, /reports/fixtures]
